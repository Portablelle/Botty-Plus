<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Botty · PS5</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <main>
    <header><span class="brand"><i class="brand-mark" aria-hidden="true"></i>BOTTY <span>/ PS5</span></span><span id="firmware">Checking console…</span></header>
    <section class="launch-area" aria-label="Launch your PS5 session">
      <div class="arena" aria-hidden="true"><div class="orbit orbit-outer"></div><div class="orbit orbit-inner"></div><span class="arena-cross cross-left">+</span><span class="arena-cross cross-right">+</span></div>
      <p class="eyebrow">YOUR CONSOLE. UNLOCKED.</p>
      <div class="launch-frame"><button id="launch" type="button" aria-describedby="status">LAUNCH</button></div>
      <p id="status" role="status" aria-live="polite">Jailbreak, Botty, FTP &amp; Transmission. All automatic.</p>
      <p class="hint">Keep this page open. Installed apps are reused.</p>
    </section>
    <footer><span class="footer-label">BOTTY SYSTEM / 01</span><span>ONE TOUCH. ALL SYSTEMS.</span></footer>
    <details id="diagnostics"><summary>Session log</summary><div id="console" role="log"></div></details>
  </main>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
