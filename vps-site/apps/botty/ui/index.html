<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Botty Downloads</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><div><span class="brand">BOTTY</span><span class="tag">DOWNLOADS</span></div><div id="space">Checking storage…</div></header>
<section class="intro"><div><p class="eyebrow">YOUR FILES. ON YOUR CONSOLE.</p><h1>Download. Extract. Play.</h1><p class="muted">Manage your downloads without leaving your PS5.</p></div><button id="add">＋ Add magnet</button></section>
<nav aria-label="Downloads"><button data-tab="all" id="tab-all" aria-pressed="true">All downloads</button><button data-tab="complete" id="tab-complete" aria-pressed="false">Completed</button><button data-tab="jobs" id="tab-jobs" aria-pressed="false">Extractions</button><button id="refresh">Refresh</button></nav>
<div id="connection" class="notice" hidden></div><div id="message" role="status" aria-live="polite"></div>
<section id="items" aria-label="Download list"><p class="empty">Connecting to rTorrent…</p></section>
<footer><span>✕ Select &nbsp; ○ Back &nbsp; D-pad Navigate</span><span>Keep your PS5 awake during downloads and extraction.</span></footer>
</main>
<div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><section class="dialog"><h2 id="modal-title"></h2><p id="modal-text"></p><label id="field-label" hidden><span id="field-name"></span><input id="field" autocomplete="off"></label><div class="actions"><button id="confirm">Continue</button><button id="cancel">Cancel</button></div></section></div>
<script src="/app.js" defer></script></body></html>
