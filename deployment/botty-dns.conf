# Dedicated PS5 DNS. Inbound access is restricted by the VPS firewall.
port=53
listen-address=203.0.113.10
bind-interfaces
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9
# Block PlayStation services and updates, except for the hosted User's Guide.
address=/playstation.com/playstation.net/#
local=/playstation.com/playstation.net/
address=/manuals.playstation.com/manuals.playstation.net/203.0.113.10
address=/manuals.playstation.com/manuals.playstation.net/::
host-record=botty.example.com,203.0.113.10,60
local=/botty.example.com/
cache-size=256
edns-packet-max=1232
domain-needed
bogus-priv
user=dnsmasq
group=nogroup
pid-file=
log-facility=-
