# http-level maps: expose only the authenticated bridge's exact API routes.
# Existing Tailnet-only UI routes retain both source and destination restrictions.
map $uri $botty_remote_public_route {
    default 0;
    "~^/botty-remote/(candidates|add|import|prepare|action|torrent/[a-f0-9]{40}|file/[a-f0-9]{40}/[0-9]+)$" 1;
}
map $botty_remote_public_route $botty_remote_destination_allowed {
    default $testvps_tailnet_destination;
    1 1;
}
map $botty_remote_public_route $botty_remote_source_allowed {
    default $testvps_tailnet_source;
    1 1;
}
# In the chosen TLS server only, replace the existing two server-level guards:
# if ($botty_remote_destination_allowed = 0) { return 403; }
# if ($botty_remote_source_allowed = 0) { return 403; }
# Include nginx.conf there. Authentication remains enforced by the bridge itself.
