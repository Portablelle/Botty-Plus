# Include inside the existing TLS server. Keep the ordinary UI's access policy
# inside location /, so this bearer-authenticated route can accept PS5 requests.
location /botty-remote/ {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:9698/;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    access_log off;
}
