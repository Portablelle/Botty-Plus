name: Botty+ checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  # PR pushes supersede old checks. Other events have independent groups so
  # another main/tag/manual run cannot discard a pending commit.
  group: botty-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  route:
    # PR workflows come from the head; the reviewer comes from the trusted base.
    # Keep legacy verification during rollout and on bases without the publisher.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, botty-plus-ci]
    timeout-minutes: 5
    outputs:
      trusted-verify: ${{ steps.route.outputs.trusted-verify }}
    steps:
      - name: Detect trusted verify publisher
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Missing policy or API failures fall back to the standalone suite.
          trusted=false
          if policy=$(gh api "repos/$REPO/contents/.github/workflows/claude-code-review.yml?ref=$BASE" --jq .content); then
            if decoded=$(printf '%s' "$policy" | base64 --decode) &&
               [[ "$decoded" == *'# BOTTY_REQUIRED_VERIFY_PUBLISHER=1'* ]]; then
              trusted=true
            fi
          fi
          if [ "$trusted" = true ]; then
            # The trusted job executes the base entry point. Validate changed
            # head entry points/workflows with standalone verify before merge.
            for file in scripts/botty-host-checks.sh .github/workflows/botty-checks.yml; do
              if ! base_hash=$(gh api "repos/$REPO/contents/$file?ref=$BASE" --jq .sha) ||
                 ! head_hash=$(gh api "repos/$REPO/contents/$file?ref=$HEAD" --jq .sha) ||
                 [[ ! "$base_hash" =~ ^[0-9a-f]{40}$ ]] ||
                 [[ "$head_hash" != "$base_hash" ]]; then
                trusted=false
                break
              fi
            done
          fi
          echo "trusted-verify=$trusted" >> "$GITHUB_OUTPUT"
  verify:
    needs: route
    # A differently named skipped check cannot replace the required status.
    name: ${{ needs.route.outputs.trusted-verify == 'true' && 'Checks handled by review workflow' || 'verify' }}
    if: always() && !cancelled() && needs.route.outputs.trusted-verify != 'true'
    runs-on: [self-hosted, linux, x64, botty-plus-ci]
    timeout-minutes: 30
    env:
      CCACHE_MAXSIZE: 128M
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          filter: blob:none
          sparse-checkout: .github/scripts
      - name: Stream the checked commit without a duplicate binary object store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" |
            tar -xz --strip-components=1 -C "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # Only default-branch pushes save the compiler cache that PR checks restore.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-host-${{ github.sha }}
          restore-keys: ccache-host-
      - name: Bound the restored compiler cache
        run: |
          if command -v ccache >/dev/null; then
            ccache --max-size="$CCACHE_MAXSIZE"
            ccache --cleanup
          fi
      - name: Detect an already validated merge
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Compile without re-running tests only when this commit's tree is exactly
          # the head of its merged same-repo PR and that head's isolated host checks
          # passed. Any doubt or API failure keeps the full suite.
          tree=$(git rev-parse "$SHA^{tree}")
          if pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
                "[.[] | select(.merge_commit_sha == \"$SHA\" and .merged_at != null)] | if length == 1 then .[0] else empty end") &&
             [ -n "$pr" ] &&
             [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] &&
             head=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<< "$pr") &&
             head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) &&
             [ "$head_tree" = "$tree" ] &&
             state=$(HEAD=$head bash .github/scripts/claude-status.sh 'Claude host checks' state) &&
             [ "$state" = success ]; then
            echo "BOTTY_HOST_CHECK_BUILD_ONLY=1" >> "$GITHUB_ENV"
            echo "::notice::$SHA has the tree of validated PR head ${head::7}; compiling without re-running tests."
          fi
      - name: Run host checks
        run: bash scripts/botty-host-checks.sh
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: ~/.cache/ccache
          key: ccache-host-${{ github.sha }}
      - name: Verify public release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/botty-packages.py --check --tag "$RELEASE_TAG"
