name: Botty+ checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, botty-plus-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test runner API broker boundaries
        run: python3 -m unittest discover -s infra/ci-runner -p 'test_*.py' -v
      - name: Verify delivery contract
        run: python3 scripts/botty-packages.py --check
      - name: Test app packaging contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test service
        run: |
          python3 homebrew/botty/tests/make_fixtures.py
          node homebrew/botty/tests/ui-test.js
          # The runner is capped at 4 CPUs; nproc may report the host's CPU count.
          # Parallelize build prerequisites; the test recipe stays sequential.
          make -C homebrew/botty -j4 NATIVE_CXX=clang++ test
      - name: Test native app
        run: |
          make -C homebrew/botty-native CXX=clang++ test integration
      - name: Test compression worker
        run: |
          python3 -m unittest discover -s homebrew/game-compressor/tests -p 'test_*.py' -v
      - name: Test rTorrent
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror homebrew/rtorrent/tests/runtime-identity-harness.cc -o /tmp/rtorrent-runtime-identity-test
          RT_IDENTITY_HARNESS=/tmp/rtorrent-runtime-identity-test python3 -m unittest discover -s homebrew/rtorrent/tests -v
          clang++ -std=c++20 -Wall -Wextra -Werror homebrew/rtorrent/tests/runtime-at-host-test.cc -o /tmp/rtorrent-runtime-at-host-test
          /tmp/rtorrent-runtime-at-host-test
      - name: Test artwork service
        run: |
          python3 deployment/botty-artwork/test_server.py
