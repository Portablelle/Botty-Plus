name: Botty+ checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  # PR pushes supersede old checks. Other events have independent groups so
  # another main/tag/manual run cannot discard a pending commit.
  group: botty-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  route:
    # PR workflows come from the head; the reviewer comes from the trusted base.
    # Keep legacy verification during rollout and on bases without the publisher.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, botty-plus-ci]
    timeout-minutes: 5
    outputs:
      trusted-verify: ${{ steps.route.outputs.trusted-verify }}
    steps:
      - name: Detect trusted verify publisher
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Missing policy or API failures fall back to the standalone suite.
          trusted=false
          if policy=$(gh api "repos/$REPO/contents/.github/workflows/claude-code-review.yml?ref=$BASE" --jq .content); then
            if decoded=$(printf '%s' "$policy" | base64 --decode) &&
               [[ "$decoded" == *'# BOTTY_REQUIRED_VERIFY_PUBLISHER=1'* ]]; then
              trusted=true
            fi
          fi
          echo "trusted-verify=$trusted" >> "$GITHUB_OUTPUT"
  verify:
    needs: route
    # A differently named skipped check cannot replace the required status.
    name: ${{ needs.route.outputs.trusted-verify == 'true' && 'Checks handled by review workflow' || 'verify' }}
    if: always() && !cancelled() && needs.route.outputs.trusted-verify != 'true'
    runs-on: [self-hosted, linux, x64, botty-plus-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run host checks
        run: bash scripts/botty-host-checks.sh
      - name: Verify public release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/botty-packages.py --check --tag "$RELEASE_TAG"
