name: Portal checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test portal and installer contracts
        run: node --test tests/*.test.mjs
      - name: Test public exports and main deployment
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify committed public packages and hashes
        run: python3 scripts/portal-manifest.py --check
